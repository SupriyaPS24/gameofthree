<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Three</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/app.js"></script>
</head>
<body>
<noscript>
    <h2 class="text-danger text-center mt-5">Javascript is disabled! Please enable it to use this site.</h2>
</noscript>
<div id="main-content" class="container py-5">
    <div class="text-center mb-4">
        <h1 class="display-4 fw-bold">Game of Three</h1>
    </div>
    <div class="row justify-content-center mb-4">
        <div class="col-md-6 text-center">
            <form class="d-flex gap-3 justify-content-center">
                <button id="connect" class="btn btn-primary btn-lg" type="submit">Join</button>
                <button id="disconnect" class="btn btn-secondary btn-lg" type="submit" disabled>Leave</button>
                <input type="hidden" id="automaticPlayer" value="">
                <input type="hidden" id="turn" value="">
                <input type="hidden" id="role" value="">
            </form>
        </div>
    </div>
    <div class="row justify-content-center mb-4">
        <div class="col-md-6" id="nameArea">
            <div class="card shadow p-4">
                <h3 class="card-title mb-3">Enter Your Name</h3>
                <form class="d-flex flex-column gap-3">
                    <input type="text" id="name" class="form-control form-control-lg" placeholder="Your name here...">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="automatic" name="automatic" value="automatic">
                        <label class="form-check-label" for="automatic">Automatic</label>
                    </div>
                    <button id="send" class="btn btn-success btn-lg">Send</button>
                </form>
            </div>
        </div>
    </div>
    <label id="playerNameDisplayArea" class="text-center fs-5 fw-semibold" style="display: none;">Player Name: </label>
    <div class="row justify-content-center mb-4">
        <div class="col-md-6" id="buttonsArea" style="display: none;">
            <div class="card shadow p-4">
                <h3 class="card-title mb-3">Choose a number..</h3>
                <form class="d-flex gap-3 justify-content-center">
                    <button id="minusOne" class="btn btn-danger btn-lg" type="button">-1</button>
                    <button id="zero" class="btn btn-warning btn-lg" type="button">0</button>
                    <button id="plusOne" class="btn btn-success btn-lg" type="button">+1</button>
                </form>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12 mb-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4>Player Events</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="playerEventsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-12">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4>Game Events</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="GameEventsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="popup">
    <div class="popup-content">
        <p>Invalid choice! The result must be divisible by 3.</p>
        <button class="close-btn" onclick="closePopup()">Close</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
